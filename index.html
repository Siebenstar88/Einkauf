<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste Pro + Smart Assistant</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background-color: #f4f6f8; }
        h2, h3 { text-align: center; color: #333; margin-bottom: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 15px; }
        
        .lang-container { text-align: right; margin-bottom: 10px; }
        .lang-select { width: auto !important; padding: 6px 10px; font-weight: bold; border-radius: 6px; border: 1px solid #0d6efd; background-color: #fff; cursor: pointer; }

        .btn-scan { width: 100%; padding: 14px; background-color: #198754; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-bakery { width: 100%; padding: 12px; background-color: #fd7e14; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-produce { width: 100%; padding: 12px; background-color: #20c997; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-action { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; color: white; }
        .btn-sort { background-color: #0d6efd; }
        .btn-stats { background-color: #6c757d; }
        .btn-download { background-color: #6f42c1; }
        .btn-share { background-color: #0dcaf0; color: #000; }
        .btn-reset { background-color: #dc3545; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-small { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        
        #reader { width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 2px; text-align: left; vertical-align: top; }
        th { background-color: #0d6efd; color: white; font-size: 11px; }
        
        input, select, textarea { width: 100%; padding: 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 70px; font-family: inherit; }
        .qty-input { width: 35px !important; text-align: center; }
        .gram-input { width: 55px !important; text-align: center; }
        .price-input { width: 60px !important; }
        .price-type-select { width: 65px !important; font-size: 10px; padding: 4px 2px; }
        .market-input { margin-bottom: 10px; font-weight: bold; }
        
        .calculated-total { font-size: 10px; font-weight: bold; color: #0d6efd; display: block; margin-top: 2px; }
        .price-change { font-size: 10px; font-weight: bold; margin-top: 2px; display: block; }
        .price-up { color: #dc3545; }
        .price-down { color: #198754; }
        .price-deal { color: #198754; font-weight: bold; font-size: 11px; background-color: #d1e7dd; padding: 2px 4px; border-radius: 3px; display: inline-block; margin-top: 2px; }
        .price-compare { font-size: 9px; color: #0d6efd; display: block; margin-top: 2px; font-style: italic; }
        
        .total-box { font-size: 20px; font-weight: bold; text-align: right; margin-top: 15px; color: #0d6efd; }
        .barcode-sub { font-size: 9px; color: #6c757d; display: block; }
        .loading-status { font-size: 10px; color: #0d6efd; font-style: italic; display: block; }
        .unit-label { font-size: 10px; font-weight: bold; color: #0d6efd; text-align: center; display: block; margin-top: 2px; }

        .completed-row { opacity: 0.4; text-decoration: line-through; background-color: #f8f9fa; }
        .check-col { text-align: center; vertical-align: middle !important; }
        .check-col input { width: 18px; height: 18px; cursor: pointer; }

        .fav-container { display: flex; gap: 6px; overflow-x: auto; padding: 5px 0; margin-top: 8px; }
        .fav-btn { background-color: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; padding: 5px 12px; font-size: 11px; font-weight: bold; white-space: nowrap; cursor: pointer; color: #495057; }
        
        .mhd-ok { color: #198754; font-weight: bold; }
        .mhd-warn { color: #fd7e14; font-weight: bold; }
        .mhd-expired { color: #dc3545; font-weight: bold; }
        
        .recipe-card { background: #eef2f5; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #0d6efd; }
        .import-box { background: #f8f9fa; border: 1px dashed #0d6efd; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="lang-container">
        🌐 <select id="languageSelect" class="lang-select" onchange="aendereSprache(this.value)">
            <option value="de">Deutsch 🇩🇪</option>
            <option value="en">English 🇬🇧</option>
            <option value="tr">Türkçe 🇹🇷</option>
            <option value="pl">Polski 🇵🇱</option>
            <option value="es">Español 🇪🇸</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="it">Italiano 🇮🇹</option>
        </select>
    </div>

    <h2 data-i18n="app_title">🛒 Einkaufsliste & Smart Assistant</h2>

    <div class="card">
        <label style="font-size: 12px; font-weight: bold; color: #555;" data-i18n="label_supermarket">Supermarkt / Geschäft:</label>
        <input type="text" id="supermarktName" class="market-input" placeholder="z.B. REWE, ALDI, Edeka..." oninput="speichereAktuelleListe()">
        
        <button class="btn-scan" onclick="startScanner()" data-i18n="btn_scan">📷 Barcode Live Scannen</button>
        <button class="btn-bakery" onclick="loseBackwareHinzufuegen()" data-i18n="btn_bakery">🥐 Lose Backware hinzufügen</button>
        <button class="btn-produce" onclick="losesObstGemueseHinzufuegen()" data-i18n="btn_produce">🥦 Loses Obst & Gemüse hinzufügen</button>
        <div id="reader"></div>

        <div style="margin-top: 10px;">
            <label style="font-size: 11px; font-weight: bold; color: #6c757d;" data-i18n="label_favorites">⭐ Schnellauswahl (Favoriten):</label>
            <div class="fav-container" id="favList">
                <span style="font-size: 11px; color: #999;" data-i18n="no_favs">Noch keine Favoriten</span>
            </div>
        </div>
    </div>

    <div class="card">
        <button class="btn-action btn-sort" onclick="nachKategorieSortieren()" data-i18n="btn_sort">↕️ Nach Kategorien sortieren</button>
        <button class="btn-action btn-stats" onclick="zeigeStatistik()" data-i18n="btn_stats">📊 Einkaufs-Statistik zeigen</button>
        
        <table id="einkaufsTabelle">
            <thead>
                <tr>
                    <th style="width: 25px;">✓</th>
                    <th data-i18n="th_item">Artikel / Kat.</th>
                    <th style="width: 35px;" data-i18n="th_qty">Anz.</th>
                    <th style="width: 55px;" data-i18n="th_amount">Menge</th>
                    <th style="width: 120px;" data-i18n="th_price">Preis (€)</th>
                    <th style="width: 20px;"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total-box">
            <span data-i18n="total_sum">Gesamtsumme:</span> <span id="gesamtpreis">0,00 €</span>
        </div>

        <button class="btn-action btn-download" onclick="listeHerunterladenCSV()" data-i18n="btn_csv">📥 Liste als CSV herunterladen</button>
        <button class="btn-action btn-share" onclick="listeTeilen()" data-i18n="btn_share">📲 Liste teilen (WhatsApp/Mail)</button>
        <button class="btn-action btn-reset" onclick="listeLeeren()" data-i18n="btn_clear">🗑️ Liste leeren</button>
    </div>

    <!-- REZEPT-INTEGRATION -->
    <div class="card">
        <h3 data-i18n="recipe_title">🍽 Smart Rezept-Importer (Gemini / Chefkoch)</h3>
        
        <div class="import-box">
            <label style="font-size: 11px; font-weight: bold; color: #333;" data-i18n="recipe_name_label">Rezept-Name:</label>
            <input type="text" id="importRezeptName" placeholder="z.B. Gemüseeintopf von Gemini" style="margin-bottom: 6px;">
            
            <label style="font-size: 11px; font-weight: bold; color: #333;" data-i18n="recipe_text_label">Zutaten oder Text kopieren (aus Chefkoch/Gemini):</label>
            <textarea id="importZutatenText" placeholder="Füge hier Zutaten ein..."></textarea>
            
            <button class="btn-action" style="background-color: #198754; margin-top: 6px;" onclick="rezeptImportieren()" data-i18n="btn_import">✨ Rezept importieren & speichern</button>
        </div>

        <div id="rezepteListe" style="margin-top: 10px;"></div>
    </div>

    <!-- VORRATSKAMMER & MHD -->
    <div class="card">
        <h3 data-i18n="pantry_title">🧊 Vorratskammer & MHD Tracker</h3>
        <p style="font-size: 11px; color: #6c757d; text-align: center; margin-top: -8px;" data-i18n="pantry_sub">Gekaufte (abgehakte) Artikel landen hier automatisch.</p>
        <table id="vorratsTabelle">
            <thead>
                <tr>
                    <th data-i18n="th_pantry_item">Artikel</th>
                    <th style="width: 90px;" data-i18n="th_pantry_mhd">MHD Datum</th>
                    <th style="width: 70px;" data-i18n="th_pantry_status">Status</th>
                    <th style="width: 20px;"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

                th_pantry_mhd: "Data Scadenza",
                th_pantry_status: "Stato",
                opt_total: "Totale",
                opt_100g: "/ 100g",
                opt_1kg: "/ 1 kg",
                at_checkout: "alla cassa",
                target_price: "🔔 Prezzo Target",
                no_recipes: "Nessuna ricetta salvata.",
                add_ingredients: "🛒 Aggiungi ingredienti",
                kat_grocery: "Generi Alimentari",
                kat_produce: "Frutta e Verdura",
                kat_bakery: "Panetteria",
                kat_drinks: "Bevande",
                kat_canned: "In scatola",

                kat_frozen: "Surgelati",
                kat_other: "Altro"
            }
        };

        let currentLang = localStorage.getItem("app_lang") || "de";
        let html5QrcodeScanner;

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("languageSelect").value = currentLang;
            aendereSprache(currentLang);
            ladeAktuelleListe();
            ladeFavoriten();
            ladeVorraete();
            ladeRezepte();
        });

        function aendereSprache(lang) {
            currentLang = lang;
            localStorage.setItem("app_lang", lang);
            let t = translations[lang] || translations.de;

            document.querySelectorAll("[data-i18n]").forEach(elem => {
                let key = elem.getAttribute("data-i18n");
                if (t[key]) {
                    elem.textContent = t[key];
                }
            });

            // Option-Texte in allen Dropdowns aktualisieren
            document.querySelectorAll(".price-type-select").forEach(select => {
                select.options[0].text = t.opt_total;
                select.options[1].text = t.opt_100g;
                select.options[2].text = t.opt_1kg;
            });

            // Re-render Berechnungsanzeigen
            berechneGesamtsumme();
            ladeRezepte();
            ladeFavoriten();
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            produktHinzufuegen(decodedText);
        }

        function loseBackwareHinzufuegen() {
            let backwarenName = prompt("Name der Backware (z.B. Kaisersemmel, Breze):");
            if (!backwarenName) return;

            let pluNummer = prompt("PLU-Nummer / Code (optional):", "");
            let code = pluNummer.trim() !== "" ? "PLU_" + pluNummer.trim() : "BACK_" + backwarenName.toLowerCase().replace(/\s+/g, '_');

            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + code)) || {};

            produktHinzufuegen(code, {
                name: backwarenName,
                kat: "Backwaren",
                menge: 1,
                gramm: gespeicherteDaten.gramm || "",
                einheit: "g",
                preis: gespeicherteDaten.preis || "",
                preisTyp: gespeicherteDaten.preisTyp || "gesamt"
            });
        }

        function losesObstGemueseHinzufuegen() {
            let artikelName = prompt("Name von Obst / Gemüse (z.B. Bananen, Äpfel):");
            if (!artikelName) return;

            let pluNummer = prompt("PLU-Nummer (z.B. 4011 für Bananen - optional):", "");
            let code = pluNummer.trim() !== "" ? "PLU_" + pluNummer.trim() : "OG_" + artikelName.toLowerCase().replace(/\s+/g, '_');

            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + code)) || {};

            produktHinzufuegen(code, {
                name: artikelName,
                kat: "Obst & Gemüse",
                menge: 1,
                gramm: gespeicherteDaten.gramm || "",
                einheit: "g",
                preis: gespeicherteDaten.preis || "",
                preisTyp: gespeicherteDaten.preisTyp || "100g"
            });
        }

        async function produktHinzufuegen(barcode, bestehendeDaten = null) {
            let t = translations[currentLang] || translations.de;
            let table = document.getElementById("einkaufsTabelle").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow(0);

            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};

            let altName = bestehendeDaten ? bestehendeDaten.name : (gespeicherteDaten.name || "");
            let altKat = bestehendeDaten ? bestehendeDaten.kat : (gespeicherteDaten.kat || "Lebensmittel");
            let altMenge = bestehendeDaten ? bestehendeDaten.menge : 1;
            let altGramm = bestehendeDaten ? bestehendeDaten.gramm : (gespeicherteDaten.gramm !== undefined ? gespeicherteDaten.gramm : "");
            let altEinheit = bestehendeDaten ? bestehendeDaten.einheit : (gespeicherteDaten.einheit || (altKat === "Getränke" ? "ml" : "g"));
            let altPreis = bestehendeDaten ? bestehendeDaten.preis : (gespeicherteDaten.preis !== undefined ? gespeicherteDaten.preis : "");
            let altPreisTyp = bestehendeDaten ? (bestehendeDaten.preisTyp || "gesamt") : (gespeicherteDaten.preisTyp || "gesamt");
            let istErledigt = bestehendeDaten ? bestehendeDaten.erledigt : false;

            if (istErledigt) newRow.classList.add("completed-row");

            let cell0 = newRow.insertCell(0);
            cell0.className = "check-col";
            cell0.innerHTML = `<input type="checkbox" ${istErledigt ? 'checked' : ''} onchange="zeileAbhaken(this, '${barcode}')">`;

            let cell1 = newRow.insertCell(1);
            cell1.innerHTML = `
                <input type="text" placeholder="..." value="${altName}" oninput="eingabeGeaendert('${barcode}', this)">
                <select onchange="kategorieGeaendert('${barcode}', this)" style="margin-top: 3px;">
                    <option value="Lebensmittel" ${altKat === 'Lebensmittel' ? 'selected' : ''}>${t.kat_grocery}</option>
                    <option value="Obst & Gemüse" ${altKat === 'Obst & Gemüse' ? 'selected' : ''}>${t.kat_produce}</option>
                    <option value="Backwaren" ${altKat === 'Backwaren' ? 'selected' : ''}>${t.kat_bakery}</option>
                    <option value="Getränke" ${altKat === 'Getränke' ? 'selected' : ''}>${t.kat_drinks}</option>
                    <option value="Dosen / Konserven" ${altKat === 'Dosen / Konserven' ? 'selected' : ''}>${t.kat_canned}</option>
                    <option value="Drogerie" ${altKat === 'Drogerie' ? 'selected' : ''}>${t.kat_drugstore}</option>
                    <option value="Tiefkühl" ${altKat === 'Tiefkühl' ? 'selected' : ''}>${t.kat_frozen}</option>
                    <option value="Sonstiges" ${altKat === 'Sonstiges' ? 'selected' : ''}>${t.kat_other}</option>
                </select>
                <span class="barcode-sub">Code: ${barcode}</span>
                <span class="loading-status" id="status_${barcode}"></span>
            `;

            let cell2 = newRow.insertCell(2);
            cell2.innerHTML = `<input type="number" class="qty-input" value="${altMenge}" min="1" oninput="eingabeGeaendert('${barcode}', this)">`;

            let cell3 = newRow.insertCell(3);
            cell3.innerHTML = `
                <input type="number" class="gram-input" placeholder="${altEinheit}" value="${altGramm}" oninput="eingabeGeaendert('${barcode}', this)">
                <span class="unit-label">${altEinheit}</span>
            `;

            let cell4 = newRow.insertCell(4);
            let targetPrice = gespeicherteDaten.zielpreis ? ` (${parseFloat(gespeicherteDaten.zielpreis).toFixed(2)}€)` : '';
            cell4.innerHTML = `
                <div style="display: flex; gap: 2px;">
                    <input type="number" step="0.01" class="price-input" placeholder="0.00" value="${altPreis}" oninput="eingabeGeaendert('${barcode}', this)">
                    <select class="price-type-select" onchange="eingabeGeaendert('${barcode}', this)">
                        <option value="gesamt" ${altPreisTyp === 'gesamt' ? 'selected' : ''}>${t.opt_total}</option>
                        <option value="100g" ${altPreisTyp === '100g' ? 'selected' : ''}>${t.opt_100g}</option>
                        <option value="1kg" ${altPreisTyp === '1kg' ? 'selected' : ''}>${t.opt_1kg}</option>
                    </select>
                </div>
                <span class="calculated-total" id="calc_${barcode}"></span>
                <button class="btn-small" style="background-color: #ffc107; color: #000; margin-top: 2px; width: 100%; font-size: 9px;" onclick="zielpreisSetzen('${barcode}')">${t.target_price}${targetPrice}</button>
                <span class="price-change" id="diff_${barcode}"></span>
                <span class="price-compare" id="comp_${barcode}"></span>
            `;

            let cell5 = newRow.insertCell(5);
            cell5.innerHTML = `<button class="btn-delete" onclick="zeileLoeschen(this)">✕</button>`;

            vergleicheUndSpeichere(barcode, newRow, gespeicherteDaten);
            berechneGesamtsumme();
            speichereAktuelleListe();

            if (!bestehendeDaten && (!altName || !altGramm) && !barcode.startsWith("BACK_") && !barcode.startsWith("OG_") && !barcode.startsWith("PLU_") && !barcode.startsWith("REZ_")) {
                await ladeProduktDatenVonOpenFoodFacts(barcode, newRow);
            }
        }

        function berechneEndpreisFuerZeile(row) {
            let qty = parseInt(row.cells[2].querySelector("input").value) || 1;
            let gramm = parseFloat(row.cells[3].querySelector("input").value) || 0;
            let eingegebenerPreis = parseFloat(row.cells[4].querySelector(".price-input").value) || 0;
            let preisTyp = row.cells[4].querySelector(".price-type-select").value;

            let einzellPreis = eingegebenerPreis;

            if (eingegebenerPreis > 0 && gramm > 0) {
                if (preisTyp === "100g") {
                    einzellPreis = (gramm / 100) * eingegebenerPreis;
                } else if (preisTyp === "1kg") {
                    einzellPreis = (gramm / 1000) * eingegebenerPreis;
                }
            }

            return einzellPreis * qty;
        }

        function zielpreisSetzen(barcode) {
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            let aktuellerZielpreis = gespeicherteDaten.zielpreis || "";

            let eingabe = prompt("Wunschpreis / Target price (€):", aktuellerZielpreis);
            if (eingabe !== null) {
                let zielpreis = parseFloat(eingabe.replace(',', '.'));
                if (!isNaN(zielpreis)) {
                    gespeicherteDaten.zielpreis = zielpreis;
                    localStorage.setItem("prod_" + barcode, JSON.stringify(gespeicherteDaten));
                    location.reload();
                }
            }
        }

        function zeileAbhaken(checkbox, barcode) {
            let row = checkbox.closest("tr");
            if (checkbox.checked) {
                row.classList.add("completed-row");
                let name = row.cells[1].querySelector("input[type='text']").value || "Unbenanntes Produkt";
                inVorratEintragen(barcode, name);
            } else {
                row.classList.remove("completed-row");
            }
            speichereAktuelleListe();
        }

        function kategorieGeaendert(barcode, selectElem) {
            let row = selectElem.closest("tr");
            let einheitLabel = row.cells[3].querySelector(".unit-label");
            let grammInput = row.cells[3].querySelector("input");

            if (selectElem.value === "Getränke") {
                einheitLabel.textContent = "ml";
                grammInput.placeholder = "ml";
            } else {
                einheitLabel.textContent = "g";
                grammInput.placeholder = "g";
            }
            eingabeGeaendert(barcode, selectElem);
        }

        async function ladeProduktDatenVonOpenFoodFacts(barcode, row) {
            let statusSpan = row.cells[1].querySelector(".loading-status");
            let nameInput = row.cells[1].querySelector("input[type='text']");
            let grammInput = row.cells[3].querySelector("input");
            let einheitLabel = row.cells[3].querySelector(".unit-label");
            let katSelect = row.cells[1].querySelector("select");

            statusSpan.textContent = "⏳...";

            try {
                let response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                let data = await response.json();

                if (data.status === 1 && data.product) {
                    let prod = data.product;
                    let prodName = prod.product_name_de || prod.product_name || "";
                    let brand = prod.brands ? prod.brands.split(",")[0] : "";
                    let vollName = brand ? `${brand} ${prodName}` : prodName;

                    if (vollName.trim() && !nameInput.value) nameInput.value = vollName.trim();

                    let catsStr = ((prod.categories_tags ? prod.categories_tags.join(" ") : "") + " " + (prod.categories || "")).toLowerCase();

                    if (catsStr.includes("beverages") || catsStr.includes("drinks")) {
                        katSelect.value = "Getränke"; einheitLabel.textContent = "ml"; grammInput.placeholder = "ml";
                    } else if (catsStr.includes("canned")) {
                        katSelect.value = "Dosen / Konserven";
                    } else if (catsStr.includes("frozen")) {
                        katSelect.value = "Tiefkühl";
                    } else if (catsStr.includes("bakery")) {
                        katSelect.value = "Backwaren";
                    } else if (catsStr.includes("fruits") || catsStr.includes("vegetables")) {
                        katSelect.value = "Obst & Gemüse";
                    }

                    if (!grammInput.value) {
                        let rawQuantity = prod.quantity || "";
                        let match = rawQuantity.match(/(\d+[\.,]?\d*)\s*(g|ml|kg|l)/i);
                        if (match) {
                            let val = parseFloat(match[1].replace(',', '.'));
                            let einheit = match[2].toLowerCase();
                            if (einheit === 'l') { val *= 1000; einheitLabel.textContent = "ml"; }
                            if (einheit === 'kg') { val *= 1000; einheitLabel.textContent = "g"; }
                            grammInput.value = val;
                        }
                    }

                    statusSpan.textContent = "✓";
                    setTimeout(() => { statusSpan.textContent = ""; }, 2500);
                    eingabeGeaendert(barcode, nameInput);
                } else {
                    statusSpan.textContent = "❌";
                    setTimeout(() => { statusSpan.textContent = ""; }, 2500);
                }
            } catch (err) {
                statusSpan.textContent = "";
            }
        }

        function eingabeGeaendert(barcode, inputElem) {
            let row = inputElem.closest("tr");
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            vergleicheUndSpeichere(barcode, row, gespeicherteDaten);
            berechneGesamtsumme();
            speichereAktuelleListe();
            ladeFavoriten();
        }

        function vergleicheUndSpeichere(barcode, row, historienDaten) {
            let t = translations[currentLang] || translations.de;
            let nameInput = row.cells[1].querySelector("input[type='text']").value;
            let katSelect = row.cells[1].querySelector("select").value;
            let grammInput = parseFloat(row.cells[3].querySelector("input").value);
            let einheit = row.cells[3].querySelector(".unit-label").textContent;
            let preisInput = parseFloat(row.cells[4].querySelector(".price-input").value);
            let preisTyp = row.cells[4].querySelector(".price-type-select").value;
            let diffSpan = row.cells[4].querySelector(".price-change");
            let compSpan = row.cells[4].querySelector(".price-compare");
            let calcSpan = row.cells[4].querySelector(".calculated-total");

            let marktName = document.getElementById("supermarktName").value.trim();
            speichereProduktHistorie(barcode, nameInput, katSelect, grammInput, einheit, preisInput, preisTyp, marktName);

            let endpreis = berechneEndpreisFuerZeile(row);
            if (preisTyp !== "gesamt" && !isNaN(endpreis) && endpreis > 0) {
                calcSpan.textContent = `= ${endpreis.toFixed(2).replace('.', ',')} € ${t.at_checkout}`;
            } else {
                calcSpan.textContent = "";
            }

            if (!isNaN(preisInput) && historienDaten.zielpreis && endpreis <= parseFloat(historienDaten.zielpreis)) {
                diffSpan.className = "price-deal";
                diffSpan.textContent = `🔥 DEAL! (≤ ${parseFloat(historienDaten.zielpreis).toFixed(2)}€)`;
                return;
            }

            if (!isNaN(preisInput) && historienDaten.preis && !isNaN(historienDaten.preis)) {
                let diff = preisInput - parseFloat(historienDaten.preis);
                if (diff > 0.005) {
                    diffSpan.className = "price-change price-up";
                    diffSpan.textContent = `+${diff.toFixed(2).replace('.', ',')} €`;
                } else if (diff < -0.005) {
                    diffSpan.className = "price-change price-down";
                    diffSpan.textContent = `${diff.toFixed(2).replace('.', ',')} €`;
                } else {
                    diffSpan.textContent = "";
                }
            } else {
                diffSpan.textContent = "";
            }

            if (historienDaten.markt && historienDaten.preis && marktName && historienDaten.markt.toLowerCase() !== marktName.toLowerCase()) {
                compSpan.textContent = `@ ${historienDaten.markt}: ${parseFloat(historienDaten.preis).toFixed(2).replace('.', ',')} €`;
            } else {
                compSpan.textContent = "";
            }
        }

        function speichereProduktHistorie(barcode, name, kat, gramm, einheit, preis, preisTyp, markt) {
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            if (name !== null) gespeicherteDaten.name = name;
            if (kat !== null) gespeicherteDaten.kat = kat;
            if (gramm !== null && !isNaN(gramm)) gespeicherteDaten.gramm = gramm;
            if (einheit) gespeicherteDaten.einheit = einheit;
            if (preis !== null && !isNaN(preis)) gespeicherteDaten.preis = preis;
            if (preisTyp) gespeicherteDaten.preisTyp = preisTyp;
            if (markt) gespeicherteDaten.markt = markt;

            localStorage.setItem("prod_" + barcode, JSON.stringify(gespeicherteDaten));
        }

        function inVorratEintragen(barcode, name) {
            let vorraete = JSON.parse(localStorage.getItem("vorratskammer")) || [];
            let in7Tagen = new Date();
            in7Tagen.setDate(in7Tagen.getDate() + 7);
            let defaultDatum = in7Tagen.toISOString().slice(0, 10);

            vorraete.push({ id: Date.now(), barcode, name, mhd: defaultDatum });
            localStorage.setItem("vorratskammer", JSON.stringify(vorraete));
            ladeVorraete();
        }

        function ladeVorraete() {
            let vorraete = JSON.parse(localStorage.getItem("vorratskammer")) || [];
            let tbody = document.getElementById("vorratsTabelle").getElementsByTagName("tbody")[0];
            tbody.innerHTML = "";

            let heute = new Date().toISOString().slice(0, 10);

            vorraete.forEach(item => {
                let row = tbody.insertRow();
                let statusText = "OK";
                let statusClass = "mhd-ok";

                if (item.mhd < heute) {
                    statusText = "Expired!";
                    statusClass = "mhd-expired";
                } else if (item.mhd === heute) {
                    statusText = "Today!";
                    statusClass = "mhd-warn";
                }

                row.innerHTML = `
                    <td style="font-size: 12px; font-weight: bold;">${item.name}</td>
                    <td><input type="date" value="${item.mhd}" style="font-size: 11px;" onchange="mhdAendern(${item.id}, this.value)"></td>
                    <td class="${statusClass}" style="font-size: 11px;">${statusText}</td>
                    <td><button class="btn-delete" onclick="vorratLoeschen(${item.id})">✕</button></td>
                `;
            });
        }

        function mhdAendern(id, neuesDatum) {
            let vorraete = JSON.parse(localStorage.getItem("vorratskammer")) || [];
            let item = vorraete.find(v => v.id === id);
            if (item) {
                item.mhd = neuesDatum;
                localStorage.setItem("vorratskammer", JSON.stringify(vorraete));
                ladeVorraete();
            }
        }

        function vorratLoeschen(id) {
            let vorraete = JSON.parse(localStorage.getItem("vorratskammer")) || [];
            vorraete = vorraete.filter(v => v.id !== id);
            localStorage.setItem("vorratskammer", JSON.stringify(vorraete));
            ladeVorraete();
        }

        function rezeptImportieren() {
            let name = document.getElementById("importRezeptName").value.trim() || "Rezept";
            let rawText = document.getElementById("importZutatenText").value;

            if (!rawText.trim()) return;

            let zeilen = rawText.split(/\r?\n/);
            let zutaten = [];

            zeilen.forEach(zeile => {
                let sauber = zeile.replace(/^[-•*–\d+\.]+\s*/, '').trim();
                if (sauber.length > 2) {
                    zutaten.push(sauber);
                }
            });

            if (zutaten.length === 0) return;

            let rezepte = JSON.parse(localStorage.getItem("rezepte")) || [];
            rezepte.push({ id: Date.now(), name: name, zutaten: zutaten });
            localStorage.setItem("rezepte", JSON.stringify(rezepte));

            document.getElementById("importRezeptName").value = "";
            document.getElementById("importZutatenText").value = "";

            ladeRezepte();
        }

        function ladeRezepte() {
            let t = translations[currentLang] || translations.de;
            let rezepte = JSON.parse(localStorage.getItem("rezepte")) || [];
            let container = document.getElementById("rezepteListe");
            container.innerHTML = "";

            if (rezepte.length === 0) {
                container.innerHTML = `<span style="font-size: 11px; color: #999;">${t.no_recipes}</span>`;
                return;
            }

            rezepte.reverse().forEach(r => {
                let card = document.createElement("div");
                card.className = "recipe-card";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="font-size: 13px;">${r.name}</strong>
                        <button class="btn-delete" onclick="rezeptLoeschen(${r.id})">✕</button>
                    </div>
                    <p style="font-size: 11px; color: #555; margin: 4px 0;">${r.zutaten.join(", ")}</p>
                    <button class="btn-small" style="background-color: #198754; color: white;" onclick="rezeptAufEinkaufsliste(${r.id})">${t.add_ingredients}</button>
                `;
                container.appendChild(card);
            });
        }

        function rezeptAufEinkaufsliste(id) {
            let rezepte = JSON.parse(localStorage.getItem("rezepte")) || [];
            let rezept = rezepte.find(r => r.id === id);
            if (!rezept) return;

            rezept.zutaten.forEach(zutat => {
                let match = zutat.match(/^(\d+[\.,]?\d*)\s*(g|ml|kg|l|Stück)?\s+(.*)/i);
                
                let mengev = "";
                let einheitv = "g";
                let namev = zutat;

                if (match) {
                    mengev = match[1];
                    einheitv = match[2] ? match[2].toLowerCase() : "g";
                    namev = match[3];
                }

                let code = "REZ_" + namev.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

                produktHinzufuegen(code, {
                    name: namev,
                    kat: "Lebensmittel",
                    menge: 1,
                    gramm: mengev,
                    einheit: einheitv,
                    preis: "",
                    preisTyp: "gesamt"
                });
            });
        }

        function rezeptLoeschen(id) {
            let rezepte = JSON.parse(localStorage.getItem("rezepte")) || [];
            rezepte = rezepte.filter(r => r.id !== id);
            localStorage.setItem("rezepte", JSON.stringify(rezepte));
            ladeRezepte();
        }

        function ladeFavoriten() {
            let t = translations[currentLang] || translations.de;
            let favContainer = document.getElementById("favList");
            favContainer.innerHTML = "";

            let alleProdukte = [];
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith("prod_")) {
                    let prod = JSON.parse(localStorage.getItem(key));
                    if (prod && prod.name) {
                        let barcode = key.replace("prod_", "");
                        alleProdukte.push({ barcode, ...prod });
                    }
                }
            }

            if (alleProdukte.length === 0) {
                favContainer.innerHTML = `<span style="font-size: 11px; color: #999;">${t.no_favs}</span>`;
                return;
            }

            alleProdukte.slice(-8).reverse().forEach(prod => {
                let btn = document.createElement("button");
                btn.className = "fav-btn";
                let preisStr = prod.preis ? ` (${parseFloat(prod.preis).toFixed(2).replace('.', ',')}€)` : "";
                btn.textContent = `+ ${prod.name}${preisStr}`;
                btn.onclick = () => {
                    produktHinzufuegen(prod.barcode, {
                        name: prod.name,
                        kat: prod.kat || "Lebensmittel",
                        menge: 1,
                        gramm: prod.gramm || "",
                        einheit: prod.einheit || "g",
                        preis: prod.preis || "",
                        preisTyp: prod.preisTyp || "gesamt"
                    });
                };
                favContainer.appendChild(btn);
            });
        }

        function zeigeStatistik() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            if (rows.length === 0) return;

            let gesamtArtikel = 0, gesamtSumme = 0;
            rows.forEach(row => {
                let qty = parseInt(row.cells[2].querySelector("input").value) || 1;
                let price = berechneEndpreisFuerZeile(row);
                gesamtArtikel += qty; gesamtSumme += price;
            });

            alert(`📊 STATS:\n- Total: ${gesamtSumme.toFixed(2).replace('.', ',')} €\n- Items: ${gesamtArtikel}`);
        }

        function berechneGesamtsumme() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            let gesamt = 0;
            rows.forEach(row => {
                gesamt += berechneEndpreisFuerZeile(row);
            });
            document.getElementById("gesamtpreis").textContent = gesamt.toFixed(2).replace('.', ',') + " €";
        }

        function speichereAktuelleListe() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            let einkaufsListe = [];
            rows.forEach(row => {
                let barcode = row.cells[1].querySelector(".barcode-sub").textContent.replace("Code: ", "").trim();
                let name = row.cells[1].querySelector("input[type='text']").value;
                let kat = row.cells[1].querySelector("select").value;
                let menge = row.cells[2].querySelector("input").value;
                let gramm = row.cells[3].querySelector("input").value;
                let einheit = row.cells[3].querySelector(".unit-label").textContent;
                let preis = row.cells[4].querySelector(".price-input").value;
                let preisTyp = row.cells[4].querySelector(".price-type-select").value;
                let erledigt = row.cells[0].querySelector("input").checked;

                einkaufsListe.push({ barcode, name, kat, menge, gramm, einheit, preis, preisTyp, erledigt });
            });

            let markt = document.getElementById("supermarktName").value;
            localStorage.setItem("aktuelle_liste", JSON.stringify(einkaufsListe));
            localStorage.setItem("aktueller_markt", markt);
        }

        function ladeAktuelleListe() {
            let savedList = JSON.parse(localStorage.getItem("aktuelle_liste")) || [];
            let savedMarkt = localStorage.getItem("aktueller_markt") || "";
            document.getElementById("supermarktName").value = savedMarkt;

            let tbody = document.getElementById("einkaufsTabelle").getElementsByTagName("tbody")[0];
            tbody.innerHTML = "";

            savedList.reverse().forEach(item => {
                produktHinzufuegen(item.barcode, item);
            });
        }

        function zeileLoeschen(btn) {
            let row = btn.closest("tr");
            row.remove();
            berechneGesamtsumme();
            speichereAktuelleListe();
        }

        function nachKategorieSortieren() {
            let tbody = document.getElementById("einkaufsTabelle").getElementsByTagName("tbody")[0];
            let rows = Array.from(tbody.rows);

            rows.sort((a, b) => {
                let katA = a.cells[1].querySelector("select").value;
                let katB = b.cells[1].querySelector("select").value;
                return katA.localeCompare(katB);
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        function listeLeeren() {
            if (confirm("Liste leeren? / Clear list?")) {
                document.getElementById("einkaufsTabelle").getElementsByTagName("tbody")[0].innerHTML = "";
                berechneGesamtsumme();
                speichereAktuelleListe();
            }
        }

        function listeHerunterladenCSV() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            if (rows.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,Erledigt;Artikel;Kategorie;Anzahl;Menge;Endpreis\n";
            rows.forEach(row => {
                let erledigt = row.cells[0].querySelector("input").checked ? "JA" : "NEIN";
                let name = row.cells[1].querySelector("input[type='text']").value;
                let kat = row.cells[1].querySelector("select").value;
                let menge = row.cells[2].querySelector("input").value;
                let gramm = row.cells[3].querySelector("input").value + row.cells[3].querySelector(".unit-label").textContent;
                let endpreis = berechneEndpreisFuerZeile(row).toFixed(2);

                csvContent += `${erledigt};"${name}";"${kat}";${menge};"${gramm}";"${endpreis}"\n`;
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "einkaufsliste.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function listeTeilen() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            if (rows.length === 0) return;

            let markt = document.getElementById("supermarktName").value;
            let text = `🛒 *Einkaufsliste*${markt ? " (" + markt + ")" : ""}:\n\n`;

            rows.forEach(row => {
                let erledigt = row.cells[0].querySelector("input").checked ? "✅ " : "⬜ ";
                let name = row.cells[1].querySelector("input[type='text']").value || "Artikel";
                let qty = row.cells[2].querySelector("input").value;
                let gramm = row.cells[3].querySelector("input").value;
                let einheit = row.cells[3].querySelector(".unit-label").textContent;
                let mengeText = gramm ? ` (${gramm}${einheit})` : "";
                let endpreis = berechneEndpreisFuerZeile(row);
                let preisText = endpreis > 0 ? ` - ${endpreis.toFixed(2).replace('.', ',')}€` : "";

                text += `${erledigt}${qty}x ${name}${mengeText}${preisText}\n`;
            });

            let summe = document.getElementById("gesamtpreis").textContent;
            text += `\n💰 *Total:* ${summe}`;

            if (navigator.share) {
                navigator.share({ title: 'Einkaufsliste', text: text });
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            }
        }
    </script>
</body>
</html>
