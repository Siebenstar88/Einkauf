<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste Pro + Preistracker</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background-color: #f4f6f8; }
        h2 { text-align: center; color: #333; margin-bottom: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 15px; }
        
        .btn-scan { width: 100%; padding: 14px; background-color: #198754; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-reset { width: 100%; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        #reader { width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 4px; text-align: left; vertical-align: top; }
        th { background-color: #0d6efd; color: white; font-size: 12px; }
        
        input, select { width: 100%; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .qty-input { width: 40px !important; text-align: center; }
        .price-input { width: 65px !important; }
        
        .price-change { font-size: 11px; font-weight: bold; margin-top: 3px; display: block; }
        .price-up { color: #dc3545; } /* Rot bei Preiserhöhung */
        .price-down { color: #198754; } /* Grün bei Preisnachlass */
        
        .total-box { font-size: 20px; font-weight: bold; text-align: right; margin-top: 15px; color: #0d6efd; }
        .barcode-sub { font-size: 10px; color: #6c757d; display: block; }
    </style>
</head>
<body>

    <h2>🛒 Einkaufsliste & Preistracker</h2>

    <div class="card">
        <button class="btn-scan" onclick="startScanner()">📷 Barcode Live Scannen</button>
        <div id="reader"></div>
    </div>

    <div class="card">
        <table id="einkaufsTabelle">
            <thead>
                <tr>
                    <th>Artikel / Code</th>
                    <th style="width: 35px;">Anz.</th>
                    <th style="width: 70px;">Preis (€)</th>
                    <th style="width: 25px;"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total-box">
            Gesamtsumme: <span id="gesamtpreis">0,00 €</span>
        </div>

        <button class="btn-reset" onclick="listeLeeren()">🗑️ Liste leeren</button>
    </div>

    <script>
        let html5QrcodeScanner;

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 150} }, false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            produktHinzufuegen(decodedText);
        }

        function produktHinzufuegen(barcode) {
            let table = document.getElementById("einkaufsTabelle").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow(0);

            // Gespeicherte Daten für diesen Barcode abrufen
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            let altName = gespeicherteDaten.name || "";
            let altPreis = gespeicherteDaten.preis !== undefined ? gespeicherteDaten.preis : "";

            // Spalte 1: Artikelname & Barcode-Info
            let cell1 = newRow.insertCell(0);
            cell1.innerHTML = `
                <input type="text" placeholder="Artikelname..." value="${altName}" oninput="speichereProdukt('${barcode}', this.value, null)">
                <span class="barcode-sub">Code: ${barcode}</span>
            `;

            // Spalte 2: Menge
            let cell2 = newRow.insertCell(1);
            cell2.innerHTML = `<input type="number" class="qty-input" value="1" min="1" oninput="berechneGesamtsumme()">`;

            // Spalte 3: Preis & Preisvergleich
            let cell3 = newRow.insertCell(2);
            cell3.innerHTML = `
                <input type="number" step="0.01" class="price-input" placeholder="0.00" value="${altPreis}" 
                       oninput="vergleicheUndSpeichere('${barcode}', this, ${altPreis !== "" ? altPreis : 'null'})">
                <span class="price-change" id="diff_${barcode}"></span>
            `;

            // Spalte 4: Löschen-Button
            let cell4 = newRow.insertCell(3);
            cell4.innerHTML = `<button class="btn-delete" onclick="zeileLoeschen(this)">✕</button>`;

            // Falls alter Preis existiert, direkt beim Laden vergleichen
            if (altPreis !== "") {
                let inputElem = cell3.querySelector("input");
                vergleicheUndSpeichere(barcode, inputElem, altPreis);
            }

            berechneGesamtsumme();
        }

        function vergleicheUndSpeichere(barcode, inputElem, altPreis) {
            let neuerPreis = parseFloat(inputElem.value);
            let diffSpan = document.getElementById("diff_" + barcode);

            if (!isNaN(neuerPreis)) {
                // Im LocalStorage aktualisieren
                let row = inputElem.closest("tr");
                let nameInput = row.cells[0].querySelector("input").value;
                speichereProdukt(barcode, nameInput, neuerPreis);

                // Preisvergleich durchführen
                if (altPreis !== null && altPreis !== "" && !isNaN(altPreis)) {
                    let diff = neuerPreis - parseFloat(altPreis);
                    if (diff > 0) {
                        diffSpan.className = "price-change price-up";
                        diffSpan.textContent = `+${diff.toFixed(2).replace('.', ',')} € teurer!`;
                    } else if (diff < 0) {
                        diffSpan.className = "price-change price-down";
                        diffSpan.textContent = `${diff.toFixed(2).replace('.', ',')} € günstiger`;
                    } else {
                        diffSpan.textContent = "";
                    }
                }
            } else {
                diffSpan.textContent = "";
            }

            berechneGesamtsumme();
        }

        function speichereProdukt(barcode, name, preis) {
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            
            if (name !== null) gespeicherteDaten.name = name;
            if (preis !== null && !isNaN(preis)) gespeicherteDaten.preis = preis;

            localStorage.setItem("prod_" + barcode, JSON.stringify(gespeicherteDaten));
        }

        function zeileLoeschen(button) {
            let row = button.parentNode.parentNode;
            row.parentNode.removeChild(row);
            berechneGesamtsumme();
        }

        function listeLeeren() {
            if (confirm("Möchtest du die Einkaufsliste leeren? (Gespeicherte Artikelpreise bleiben erhalten)")) {
                document.getElementById("einkaufsTabelle").getElementsByTagName('tbody')[0].innerHTML = "";
                berechneGesamtsumme();
            }
        }

        function berechneGesamtsumme() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            let total = 0;

            rows.forEach(row => {
                let qtyInput = row.cells[1].querySelector("input");
                let priceInput = row.cells[2].querySelector("input");

                let qty = parseInt(qtyInput.value) || 1;
                let price = parseFloat(priceInput.value) || 0;

                total += qty * price;
            });

            document.getElementById("gesamtpreis").textContent = total.toFixed(2).replace('.', ',') + " €";
        }
    </script>

</body>
</html>
