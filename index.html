<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste Pro + Tracker</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background-color: #f4f6f8; }
        h2 { text-align: center; color: #333; margin-bottom: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 15px; }
        
        .btn-scan { width: 100%; padding: 14px; background-color: #198754; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-bakery { width: 100%; padding: 12px; background-color: #fd7e14; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-action { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; color: white; }
        .btn-sort { background-color: #0d6efd; }
        .btn-download { background-color: #6f42c1; }
        .btn-share { background-color: #0dcaf0; color: #000; }
        .btn-reset { background-color: #dc3545; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        #reader { width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 2px; text-align: left; vertical-align: top; }
        th { background-color: #0d6efd; color: white; font-size: 11px; }
        
        input, select { width: 100%; padding: 5px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .qty-input { width: 35px !important; text-align: center; }
        .gram-input { width: 55px !important; text-align: center; }
        .price-input { width: 60px !important; }
        .market-input { margin-bottom: 10px; font-weight: bold; }
        
        .price-change { font-size: 10px; font-weight: bold; margin-top: 2px; display: block; }
        .price-up { color: #dc3545; }
        .price-down { color: #198754; }
        
        .total-box { font-size: 20px; font-weight: bold; text-align: right; margin-top: 15px; color: #0d6efd; }
        .barcode-sub { font-size: 9px; color: #6c757d; display: block; }
        .loading-status { font-size: 10px; color: #0d6efd; font-style: italic; display: block; }
        .unit-label { font-size: 10px; font-weight: bold; color: #0d6efd; text-align: center; display: block; margin-top: 2px; }
    </style>
</head>
<body>

    <h2>🛒 Einkaufsliste & Preistracker</h2>

    <div class="card">
        <label style="font-size: 12px; font-weight: bold; color: #555;">Supermarkt / Geschäft:</label>
        <input type="text" id="supermarktName" class="market-input" placeholder="z.B. REWE, ALDI, Edeka..." oninput="speichereAktuelleListe()">
        
        <button class="btn-scan" onclick="startScanner()">📷 Barcode Live Scannen</button>
        <button class="btn-bakery" onclick="loseBackwareHinzufuegen()">🥐 Lose Backware hinzufügen (ohne Barcode)</button>
        <div id="reader"></div>
    </div>

    <div class="card">
        <button class="btn-action btn-sort" onclick="nachKategorieSortieren()">↕️ Nach Kategorien sortieren</button>
        
        <table id="einkaufsTabelle">
            <thead>
                <tr>
                    <th>Artikel / Kat.</th>
                    <th style="width: 35px;">Anz.</th>
                    <th style="width: 55px;">Menge</th>
                    <th style="width: 60px;">Preis (€)</th>
                    <th style="width: 20px;"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total-box">
            Gesamtsumme: <span id="gesamtpreis">0,00 €</span>
        </div>

        <button class="btn-action btn-download" onclick="listeHerunterladenCSV()">📥 Einkaufsliste herunterladen (CSV)</button>
        <button class="btn-action btn-share" onclick="listeTeilen()">📲 Liste teilen (WhatsApp/Mail)</button>
        <button class="btn-action btn-reset" onclick="listeLeeren()">🗑️ Liste leeren</button>
    </div>

    <script>
        let html5QrcodeScanner;

        document.addEventListener("DOMContentLoaded", ladeAktuelleListe);

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 150} }, false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            produktHinzufuegen(decodedText);
        }

        // Spezielle Funktion für lose Backwaren (Bäckerei/Backshop)
        function loseBackwareHinzufuegen() {
            let backwarenName = prompt("Name der Backware (z.B. Kaisersemmel, Breze):");
            if (!backwarenName) return; // Abbrechen, falls nichts eingegeben wurde

            let pluNummer = prompt("PLU-Nummer / Code vom Schild (optional, sonst automatisch):", "");
            
            // Wenn eine PLU angegeben wurde, nutzen wir diese, sonst erzeugen wir einen internen Code "BACK-..."
            let code = pluNummer.trim() !== "" ? "PLU_" + pluNummer.trim() : "BACK_" + backwarenName.toLowerCase().replace(/\s+/g, '_');

            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + code)) || {};

            produktHinzufuegen(code, {
                name: backwarenName,
                kat: "Backwaren",
                menge: 1,
                gramm: gespeicherteDaten.gramm || "",
                einheit: "g",
                preis: gespeicherteDaten.preis || ""
            });
        }

        async function produktHinzufuegen(barcode, bestehendeDaten = null) {
            let table = document.getElementById("einkaufsTabelle").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow(0);

            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};

            let altName = bestehendeDaten ? bestehendeDaten.name : (gespeicherteDaten.name || "");
            let altKat = bestehendeDaten ? bestehendeDaten.kat : (gespeicherteDaten.kat || "Lebensmittel");
            let altMenge = bestehendeDaten ? bestehendeDaten.menge : 1;
            let altGramm = bestehendeDaten ? bestehendeDaten.gramm : (gespeicherteDaten.gramm !== undefined ? gespeicherteDaten.gramm : "");
            let altEinheit = bestehendeDaten ? bestehendeDaten.einheit : (gespeicherteDaten.einheit || (altKat === "Getränke" ? "ml" : "g"));
            let altPreis = bestehendeDaten ? bestehendeDaten.preis : (gespeicherteDaten.preis !== undefined ? gespeicherteDaten.preis : "");

            // Spalte 1: Name, Kategorie & Code/Barcode
            let cell1 = newRow.insertCell(0);
            cell1.innerHTML = `
                <input type="text" placeholder="Artikelname..." value="${altName}" oninput="eingabeGeaendert('${barcode}', this)">
                <select onchange="kategorieGeaendert('${barcode}', this)" style="margin-top: 3px;">
                    <option ${altKat === 'Lebensmittel' ? 'selected' : ''}>Lebensmittel</option>
                    <option ${altKat === 'Backwaren' ? 'selected' : ''}>Backwaren</option>
                    <option ${altKat === 'Getränke' ? 'selected' : ''}>Getränke</option>
                    <option ${altKat === 'Dosen / Konserven' ? 'selected' : ''}>Dosen / Konserven</option>
                    <option ${altKat === 'Obst & Gemüse' ? 'selected' : ''}>Obst & Gemüse</option>
                    <option ${altKat === 'Drogerie' ? 'selected' : ''}>Drogerie</option>
                    <option ${altKat === 'Tiefkühl' ? 'selected' : ''}>Tiefkühl</option>
                    <option ${altKat === 'Sonstiges' ? 'selected' : ''}>Sonstiges</option>
                </select>
                <span class="barcode-sub">Code: ${barcode}</span>
                <span class="loading-status" id="status_${barcode}"></span>
            `;

            // Spalte 2: Menge (Anzahl)
            let cell2 = newRow.insertCell(1);
            cell2.innerHTML = `<input type="number" class="qty-input" value="${altMenge}" min="1" oninput="eingabeGeaendert('${barcode}', this)">`;

            // Spalte 3: Menge in g / ml
            let cell3 = newRow.insertCell(2);
            cell3.innerHTML = `
                <input type="number" class="gram-input" placeholder="${altEinheit}" value="${altGramm}"
                       oninput="eingabeGeaendert('${barcode}', this)">
                <span class="unit-label">${altEinheit}</span>
            `;

            // Spalte 4: Preis & Vergleichs-Anzeige
            let cell4 = newRow.insertCell(3);
            cell4.innerHTML = `
                <input type="number" step="0.01" class="price-input" placeholder="0.00" value="${altPreis}" 
                       oninput="eingabeGeaendert('${barcode}', this)">
                <span class="price-change" id="diff_${barcode}"></span>
            `;

            // Spalte 5: Löschen
            let cell5 = newRow.insertCell(4);
            cell5.innerHTML = `<button class="btn-delete" onclick="zeileLoeschen(this)">✕</button>`;

            vergleicheUndSpeichere(barcode, newRow, gespeicherteDaten);
            berechneGesamtsumme();
            speichereAktuelleListe();

            // Nur wenn es ein gescannter Online-Barcode ist (nicht manuell / Backware)
            if (!bestehendeDaten && (!altName || !altGramm) && !barcode.startsWith("BACK_") && !barcode.startsWith("PLU_")) {
                await ladeProduktDatenVonOpenFoodFacts(barcode, newRow);
            }
        }

        function kategorieGeaendert(barcode, selectElem) {
            let row = selectElem.closest("tr");
            let einheitLabel = row.cells[2].querySelector(".unit-label");
            let grammInput = row.cells[2].querySelector("input");

            if (selectElem.value === "Getränke") {
                einheitLabel.textContent = "ml";
                grammInput.placeholder = "ml";
            } else {
                einheitLabel.textContent = "g";
                grammInput.placeholder = "g";
            }

            eingabeGeaendert(barcode, selectElem);
        }

        async function ladeProduktDatenVonOpenFoodFacts(barcode, row) {
            let statusSpan = row.cells[0].querySelector(".loading-status");
            let nameInput = row.cells[0].querySelector("input[type='text']");
            let grammInput = row.cells[2].querySelector("input");
            let einheitLabel = row.cells[2].querySelector(".unit-label");
            let katSelect = row.cells[0].querySelector("select");

            statusSpan.textContent = "⏳ Suche im Internet...";

            try {
                let response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                let data = await response.json();

                if (data.status === 1 && data.product) {
                    let prod = data.product;

                    let prodName = prod.product_name_de || prod.product_name || "";
                    let brand = prod.brands ? prod.brands.split(",")[0] : "";
                    let vollName = brand ? `${brand} ${prodName}` : prodName;

                    if (vollName.trim() && !nameInput.value) {
                        nameInput.value = vollName.trim();
                    }

                    let catsStr = ((prod.categories_tags ? prod.categories_tags.join(" ") : "") + " " + (prod.categories || "")).toLowerCase();

                    let istGetraenk = catsStr.includes("beverages") || catsStr.includes("drinks") || catsStr.includes("soda") || 
                                     catsStr.includes("juices") || catsStr.includes("bier") || catsStr.includes("beer") || 
                                     catsStr.includes("wasser") || catsStr.includes("limonade") || catsStr.includes("saft");

                    let istDose = catsStr.includes("canned") || catsStr.includes("dosen") || catsStr.includes("konserven");

                    if (istGetraenk) {
                        katSelect.value = "Getränke";
                        einheitLabel.textContent = "ml";
                        grammInput.placeholder = "ml";
                    } else if (istDose) {
                        katSelect.value = "Dosen / Konserven";
                        einheitLabel.textContent = "g";
                        grammInput.placeholder = "g";
                    } else if (catsStr.includes("frozen") || catsStr.includes("tiefkühl")) {
                        katSelect.value = "Tiefkühl";
                    } else if (catsStr.includes("fruits") || catsStr.includes("vegetables") || catsStr.includes("gemüse") || catsStr.includes("obst")) {
                        katSelect.value = "Obst & Gemüse";
                    } else if (catsStr.includes("bakery") || catsStr.includes("bread") || catsStr.includes("brot")) {
                        katSelect.value = "Backwaren";
                    } else if (catsStr.includes("non-food") || catsStr.includes("drogerie")) {
                        katSelect.value = "Drogerie";
                    }

                    if (!grammInput.value) {
                        let rawQuantity = prod.quantity || "";
                        let match = rawQuantity.match(/(\d+[\.,]?\d*)\s*(g|ml|kg|l|cl|dl)/i);
                        if (match) {
                            let val = parseFloat(match[1].replace(',', '.'));
                            let einheit = match[2].toLowerCase();

                            if (einheit === 'l' || einheit === 'cl' || einheit === 'dl' || einheit === 'ml') {
                                if (einheit === 'l') val *= 1000;
                                if (einheit === 'cl') val *= 10;
                                if (einheit === 'dl') val *= 100;
                                einheitLabel.textContent = "ml";
                                grammInput.placeholder = "ml";
                                katSelect.value = "Getränke";
                            } else {
                                if (einheit === 'kg') val *= 1000;
                                einheitLabel.textContent = "g";
                                grammInput.placeholder = "g";
                            }
                            grammInput.value = val;
                        }
                    }

                    statusSpan.textContent = "✓ Gefunden";
                    setTimeout(() => { statusSpan.textContent = ""; }, 2500);

                    eingabeGeaendert(barcode, nameInput);
                } else {
                    statusSpan.textContent = "❌ Nicht online gefunden";
                    setTimeout(() => { statusSpan.textContent = ""; }, 2500);
                }
            } catch (err) {
                console.error("Fehler beim Abrufen der Produktdaten:", err);
                statusSpan.textContent = "";
            }
        }

        function eingabeGeaendert(barcode, inputElem) {
            let row = inputElem.closest("tr");
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            vergleicheUndSpeichere(barcode, row, gespeicherteDaten);
            berechneGesamtsumme();
            speichereAktuelleListe();
        }

        function vergleicheUndSpeichere(barcode, row, historienDaten) {
            let nameInput = row.cells[0].querySelector("input[type='text']").value;
            let katSelect = row.cells[0].querySelector("select").value;
            let grammInput = parseFloat(row.cells[2].querySelector("input").value);
            let einheit = row.cells[2].querySelector(".unit-label").textContent;
            let preisInput = parseFloat(row.cells[3].querySelector("input").value);
            let diffSpan = row.cells[3].querySelector(".price-change");

            let marktName = document.getElementById("supermarktName").value;

            let altGramm = historienDaten.gramm;
            let altPreis = historienDaten.preis;

            speichereProduktHistorie(barcode, nameInput, katSelect, grammInput, einheit, preisInput, marktName);

            let einheitText = einheit === "ml" ? "100ml" : "100g";

            if (!isNaN(preisInput) && !isNaN(grammInput) && grammInput > 0) {
                let aktuellerGrundpreis = (preisInput / grammInput) * 100;

                if (altPreis && altGramm && !isNaN(altPreis) && !isNaN(altGramm) && altGramm > 0) {
                    let alterGrundpreis = (parseFloat(altPreis) / parseFloat(altGramm)) * 100;
                    let diffGrundpreis = aktuellerGrundpreis - alterGrundpreis;

                    if (diffGrundpreis > 0.005) {
                        diffSpan.className = "price-change price-up";
                        diffSpan.textContent = `Teurer! (+${diffGrundpreis.toFixed(2).replace('.', ',')} €/${einheitText})`;
                    } else if (diffGrundpreis < -0.005) {
                        diffSpan.className = "price-change price-down";
                        diffSpan.textContent = `Günstiger (${diffGrundpreis.toFixed(2).replace('.', ',')} €/${einheitText})`;
                    } else {
                        diffSpan.className = "price-change";
                        diffSpan.textContent = "Preis unverändert";
                    }
                } else {
                    diffSpan.textContent = "";
                }
            } else if (!isNaN(preisInput) && altPreis && !isNaN(altPreis)) {
                let diff = preisInput - parseFloat(altPreis);
                if (diff > 0) {
                    diffSpan.className = "price-change price-up";
                    diffSpan.textContent = `+${diff.toFixed(2).replace('.', ',')} € teurer`;
                } else if (diff < 0) {
                    diffSpan.className = "price-change price-down";
                    diffSpan.textContent = `${diff.toFixed(2).replace('.', ',')} € günstiger`;
                } else {
                    diffSpan.textContent = "";
                }
            } else {
                diffSpan.textContent = "";
            }
        }

        function speichereProduktHistorie(barcode, name, kat, gramm, einheit, preis, markt) {
            let gespeicherteDaten = JSON.parse(localStorage.getItem("prod_" + barcode)) || {};
            
            if (name !== null) gespeicherteDaten.name = name;
            if (kat !== null) gespeicherteDaten.kat = kat;
            if (gramm !== null && !isNaN(gramm)) gespeicherteDaten.gramm = gramm;
            if (einheit) gespeicherteDaten.einheit = einheit;
            if (preis !== null && !isNaN(preis)) gespeicherteDaten.preis = preis;
            if (markt) gespeicherteDaten.markt = markt;

            localStorage.setItem("prod_" + barcode, JSON.stringify(gespeicherteDaten));
        }

        function speichereAktuelleListe() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            let einkaufsListe = [];
            let marktName = document.getElementById("supermarktName").value;

            rows.forEach(row => {
                let barcode = row.cells[0].querySelector(".barcode-sub").textContent.replace("Code: ", "").trim();
                let name = row.cells[0].querySelector("input[type='text']").value;
                let kat = row.cells[0].querySelector("select").value;
                let menge = row.cells[1].querySelector("input").value;
                let gramm = row.cells[2].querySelector("input").value;
                let einheit = row.cells[2].querySelector(".unit-label").textContent;
                let preis = row.cells[3].querySelector("input").value;

                einkaufsListe.push({ barcode, name, kat, menge, gramm, einheit, preis });
            });

            localStorage.setItem("aktuelle_einkaufsliste", JSON.stringify(einkaufsListe));
            localStorage.setItem("aktueller_supermarkt", marktName);
        }

        function ladeAktuelleListe() {
            let gespeicherterMarkt = localStorage.getItem("aktueller_supermarkt");
            if (gespeicherterMarkt) {
                document.getElementById("supermarktName").value = gespeicherterMarkt;
            }

            let gespeicherteListe = JSON.parse(localStorage.getItem("aktuelle_einkaufsliste"));
            if (gespeicherteListe && gespeicherteListe.length > 0) {
                gespeicherteListe.reverse().forEach(item => {
                    produktHinzufuegen(item.barcode, item);
                });
            }
        }

        function nachKategorieSortieren() {
            let tbody = document.querySelector("#einkaufsTabelle tbody");
            let rows = Array.from(tbody.querySelectorAll("tr"));

            rows.sort((a, b) => {
                let katA = a.cells[0].querySelector("select").value;
                let katB = b.cells[0].querySelector("select").value;
                return katA.localeCompare(katB);
            });

            rows.forEach(row => tbody.appendChild(row));
            speichereAktuelleListe();
        }

        function listeHerunterladenCSV() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            if (rows.length === 0) {
                alert("Die Liste ist leer!");
                return;
            }

            let markt = document.getElementById("supermarktName").value || "Unbekannter Markt";
            let datum = new Date().toLocaleDateString("de-DE");

            let csvContent = "\uFEFFDatum;Supermarkt;Barcode;Artikelname;Kategorie;Anzahl;Menge;Einheit;Einzelpreis (€);Gesamtpreis (€)\n";

            rows.forEach(row => {
                let barcode = row.cells[0].querySelector(".barcode-sub").textContent.replace("Code: ", "").trim();
                let name = row.cells[0].querySelector("input[type='text']").value || "Unbenannt";
                let kat = row.cells[0].querySelector("select").value;
                let qty = parseInt(row.cells[1].querySelector("input").value) || 1;
                let gramm = row.cells[2].querySelector("input").value || "-";
                let einheit = row.cells[2].querySelector(".unit-label").textContent;
                let price = parseFloat(row.cells[3].querySelector("input").value) || 0;
                let rowTotal = (qty * price).toFixed(2).replace('.', ',');
                let priceFormatted = price.toFixed(2).replace('.', ',');

                csvContent += `"${datum}";"${markt}";"${barcode}";"${name}";"${kat}";"${qty}";"${gramm}";"${einheit}";"${priceFormatted}";"${rowTotal}"\n`;
            });

            let gesamt = document.getElementById("gesamtpreis").textContent;
            csvContent += `\n;;;;;;;;Gesamtsumme:;"${gesamt}"\n`;

            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            
            let dateStr = new Date().toISOString().slice(0,10);
            link.setAttribute("href", url);
            link.setAttribute("download", `Einkauf_${markt.replace(/[^a-z0-9]/gi, '_')}_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function listeTeilen() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            if (rows.length === 0) {
                alert("Die Liste ist leer!");
                return;
            }

            let markt = document.getElementById("supermarktName").value;
            let marktHeader = markt ? ` bei *${markt}*` : "";
            let text = `🛒 *Meine Einkaufsliste${marktHeader}:*\n\n`;

            rows.forEach(row => {
                let name = row.cells[0].querySelector("input[type='text']").value || "Unbenanntes Produkt";
                let kat = row.cells[0].querySelector("select").value;
                let qty = row.cells[1].querySelector("input").value || "1";
                let gramm = row.cells[2].querySelector("input").value;
                let einheit = row.cells[2].querySelector(".unit-label").textContent;
                let price = row.cells[3].querySelector("input").value || "0.00";

                let grammStr = gramm ? ` (${gramm}${einheit})` : "";
                text += `• ${qty}x ${name}${grammStr} [${kat}] - ${price} €\n`;
            });

            let gesamt = document.getElementById("gesamtpreis").textContent;
            text += `\n*Gesamtsumme: ${gesamt}*`;

            if (navigator.share) {
                navigator.share({ title: 'Einkaufsliste', text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert("Einkaufsliste wurde in die Zwischenablage kopiert!");
            }
        }

        function zeileLoeschen(button) {
            let row = button.parentNode.parentNode;
            row.parentNode.removeChild(row);
            berechneGesamtsumme();
            speichereAktuelleListe();
        }

        function listeLeeren() {
            if (confirm("Möchtest du die aktuelle Einkaufsliste wirklich leeren? (Die Preishistorie der Produkte bleibt erhalten)")) {
                document.getElementById("einkaufsTabelle").getElementsByTagName('tbody')[0].innerHTML = "";
                localStorage.removeItem("aktuelle_einkaufsliste");
                berechneGesamtsumme();
            }
        }

        function berechneGesamtsumme() {
            let rows = document.querySelectorAll("#einkaufsTabelle tbody tr");
            let total = 0;

            rows.forEach(row => {
                let qtyInput = row.cells[1].querySelector("input");
                let priceInput = row.cells[3].querySelector("input");

                let qty = parseInt(qtyInput.value) || 1;
                let price = parseFloat(priceInput.value) || 0;

                total += qty * price;
            });

            document.getElementById("gesamtpreis").textContent = total.toFixed(2).replace('.', ',') + " €";
        }
    </script>

</body>
</html>
